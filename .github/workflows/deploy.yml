name: Deploy Inertia POS to Hostinger (Alwin Branch)

on:
  push:
    branches:
      - Alwin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, mysql, gd, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: |
          composer install --no-ansi --no-interaction --no-dev --prefer-dist --optimize-autoloader

      - name: Install & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Create Release Zip Archive
        run: |
          zip -r release.zip . -x ".git*" ".github*" "node_modules/*" "tests/*" "e2e/*" "storage/*" ".env*" "playwright-report/*" "test-results/*" "playwright.config.js" "postcss.config.js" "tailwind.config.js" "vite.config.js"

      - name: Upload Zip to Hostinger via FTP
        run: |
          curl --ftp-create-dirs -T release.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_UPLOAD_URL }}"

      - name: Trigger Server-side Deployment Script
        run: |
          curl -f -G --data-urlencode "token=${{ secrets.DEPLOY_TOKEN }}" "${{ secrets.DEPLOY_TRIGGER_URL }}"
